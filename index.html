<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kumwai</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #0a1628;
    color: #f2f2f2;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }
  header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid #1d2f47;
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex: 0 0 auto;
  }
  header h1 { font-size: 22px; margin: 0; letter-spacing: .3px; }
  header .sub { color: #d4a017; font-size: 13px; font-style: italic; }
  header .spacer { flex: 1; }
  #status { font-size: 13px; color: #9fb2c8; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  #status .dot { width: 9px; height: 9px; border-radius: 50%; background: #666; display: inline-block; }
  #status.live .dot { background: #2ecc71; }
  #status.live { color: #7fd6a4; }
  #status.down .dot { background: #e05d44; }
  #status.down { color: #e89a8a; }
  #clear {
    background: none; border: 1px solid #33507a; color: #9fb2c8;
    border-radius: 8px; padding: 6px 10px; font-size: 13px; margin-left: 8px;
  }
  #chat {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg { max-width: 85%; padding: 11px 14px; border-radius: 16px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
  .msg.me { align-self: flex-end; background: #8a6d1a; color: #fff; border-bottom-right-radius: 4px; }
  .msg.her { align-self: flex-start; background: #16263f; border: 1px solid #24395a; border-bottom-left-radius: 4px; }
  .msg.thinking { color: #9fb2c8; font-style: italic; }
  .msg.error { background: #3d1a15; border: 1px solid #6e2b20; color: #f0b8ac; }
  #composer {
    flex: 0 0 auto;
    display: flex;
    gap: 10px;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid #1d2f47;
    background: #0a1628;
  }
  #input {
    flex: 1;
    font-size: 17px;
    padding: 13px 14px;
    border-radius: 22px;
    border: 1px solid #33507a;
    background: #101f33;
    color: #f2f2f2;
    outline: none;
  }
  #input:focus { border-color: #d4a017; }
  #send {
    flex: 0 0 auto;
    font-size: 17px;
    font-weight: 600;
    padding: 0 22px;
    border-radius: 22px;
    border: none;
    background: #d4a017;
    color: #0a1628;
  }
  #send:disabled { opacity: .5; }
</style>
</head>
<body>
<header>
  <h1>Kumwai</h1>
  <span class="sub">Arise and live.</span>
  <span class="spacer"></span>
  <span id="status"><span class="dot"></span><span id="statusText">Checking…</span></span>
  <button id="clear" type="button">Clear</button>
</header>

<div id="chat"></div>

<div id="composer">
  <input id="input" type="text" placeholder="Talk to Kumwai…" autocomplete="off" enterkeyhint="send">
  <button id="send" type="button">Send</button>
</div>

<script>
  var API = "https://kumwai.shaethonai.com";
  var AGENT = "kumwai";
  var THREAD = "phone-chat";
  var RESOURCE = "seth";
  var STORE_KEY = "kumwai-chat-history-v1";
  var MAX_HISTORY = 20;

  var chatEl = document.getElementById("chat");
  var inputEl = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var statusEl = document.getElementById("status");
  var statusText = document.getElementById("statusText");

  var chatHistory = [];
  try {
    var saved = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
    if (Array.isArray(saved)) chatHistory = saved.filter(function (m) { return m && (m.role === "user" || m.role === "assistant") && typeof m.content === "string"; });
  } catch (e) { chatHistory = []; }

  function saveHistory() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(chatHistory.slice(-MAX_HISTORY))); } catch (e) {}
  }

  function bubble(text, cls) {
    var div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  function renderAll() {
    chatEl.innerHTML = "";
    if (chatHistory.length === 0) {
      bubble("Hey Seth. I'm here. Say something and I'll answer — and I'll remember it.", "her");
      return;
    }
    chatHistory.forEach(function (m) {
      bubble(m.content, m.role === "user" ? "me" : "her");
    });
  }

  function setStatus(live) {
    statusEl.className = live ? "live" : "down";
    statusText.textContent = live ? "Live" : "Offline";
  }

  function checkHealth() {
    fetch(API + "/health", { method: "GET" })
      .then(function (r) { setStatus(r.ok); })
      .catch(function () { setStatus(false); });
  }

  var busy = false;
  function send() {
    var text = inputEl.value.trim();
    if (!text || busy) return;
    busy = true;
    sendBtn.disabled = true;
    inputEl.value = "";
    chatHistory.push({ role: "user", content: text });
    saveHistory();
    bubble(text, "me");
    var thinking = bubble("Kumwai is thinking…", "her thinking");

    fetch(API + "/api/agents/" + AGENT + "/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: chatHistory.slice(-MAX_HISTORY),
        resourceId: RESOURCE,
        threadId: THREAD
      })
    })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        var reply = (data && data.text) || "";
        if (!reply) throw new Error("empty reply");
        thinking.remove();
        chatHistory.push({ role: "assistant", content: reply });
        saveHistory();
        bubble(reply, "her");
        setStatus(true);
      })
      .catch(function () {
        thinking.remove();
        bubble("I couldn't reach her right now. The Chromebook tabs may be closed or asleep — Kumwai's server and the tunnel both need to be running.", "error");
        setStatus(false);
      })
      .finally(function () {
        busy = false;
        sendBtn.disabled = false;
        inputEl.focus();
      });
  }

  sendBtn.addEventListener("click", send);
  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") send();
  });
  document.getElementById("clear").addEventListener("click", function () {
    if (!confirm("Clear this chat from this phone? Kumwai keeps her own memory — this only clears what you see here.")) return;
    chatHistory = [];
    saveHistory();
    renderAll();
  });

  renderAll();
  checkHealth();
  inputEl.focus();
</script>
</body>
</html>
